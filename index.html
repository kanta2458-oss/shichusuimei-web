<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四柱推命 計算</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#1f2328;background:#f5f2ed}*{box-sizing:border-box}body{margin:0;padding:18px}main{display:grid;grid-template-columns:360px 1fr 300px;gap:16px;max-width:1400px;margin:auto}.panel{background:#fffdf9;border:1px solid #d8d0c4;border-radius:8px;padding:16px;box-shadow:0 1px 2px #0001}h1,h2,p{margin:0 0 10px}label{display:grid;gap:5px;font-weight:700;margin:10px 0}input,select,button{font:inherit;border:1px solid #bbb2a7;border-radius:6px;padding:9px;width:100%}button{cursor:pointer;background:#243b53;color:white;border-color:#243b53;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pillar{border:1px solid #ddd5ca;border-radius:8px;padding:12px;text-align:center;min-height:100px}.pillar small{color:#666}.pillar b{font-size:2rem;display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metrics div{border-top:2px solid #ddd5ca;padding-top:8px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e5ded5;padding:7px;text-align:left}.history-item{display:grid;grid-template-columns:1fr 40px;gap:6px;margin:6px 0}.history-item button{background:#fff;color:#222;border-color:#bbb;text-align:left}.hint{color:#666;font-size:.9rem}@media(max-width:1000px){main{grid-template-columns:1fr}.grid,.metrics{grid-template-columns:1fr 1fr}}@media(max-width:560px){body{padding:10px}.grid,.metrics{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>四柱推命 計算</h1>
    <p class="hint">入力内容はこの端末の履歴以外には保存しません。</p>
    <form id="form">
      <label>生年月日<input id="birthDate" type="date" value="2000-05-08" required></label>
      <label>出生時刻<input id="birthTime" type="time" value="15:54"></label>
      <label>性別<select id="gender"><option value="male">男性</option><option value="female">女性</option></select></label>
      <label>出生地<input id="place" value="岡山県岡山市南区千鳥町"></label>
      <label>経度<input id="longitude" type="number" step="0.0001" value="133.93" required></label>
      <label><input id="correction" type="checkbox" checked style="width:auto"> 経度補正を使う</label>
      <button>計算する</button>
    </form>
    <p class="hint" style="margin-top:12px">住所検索は次版でGoogle Maps APIキー設定後に有効化します。現版は経度手入力です。</p>
  </section>
  <section class="panel">
    <h2>計算結果</h2>
    <div id="result"><p class="hint">計算すると命式が表示されます。</p></div>
  </section>
  <aside class="panel">
    <h2>履歴</h2>
    <button id="clear" type="button">全削除</button>
    <div id="history"></div>
  </aside>
</main>
<script>
const stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const stages=['長生','沐浴','冠帯','建禄','帝旺','衰','病','死','墓','絶','胎','養'];
const stageStart={甲:['亥','子','丑','寅','卯','辰','巳','午','未','申','酉','戌'],乙:['午','巳','辰','卯','寅','丑','子','亥','戌','酉','申','未'],丙:['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'],丁:['酉','申','未','午','巳','辰','卯','寅','丑','子','亥','戌'],戊:['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'],己:['酉','申','未','午','巳','辰','卯','寅','丑','子','亥','戌'],庚:['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'],辛:['子','亥','戌','酉','申','未','午','巳','辰','卯','寅','丑'],壬:['申','酉','戌','亥','子','丑','寅','卯','辰','巳','午','未'],癸:['卯','寅','丑','子','亥','戌','酉','申','未','午','巳','辰']};
const elem={甲:'木',乙:'木',丙:'火',丁:'火',戊:'土',己:'土',庚:'金',辛:'金',壬:'水',癸:'水'};const yang=new Set(['甲','丙','戊','庚','壬']);const gen={木:'火',火:'土',土:'金',金:'水',水:'木'};const ctrl={木:'土',火:'金',土:'水',金:'木',水:'火'};
function gz(n){let i=((n-1)%60+60)%60;return {number:i+1,stem:stems[i%10],branch:branches[i%12],ganzhi:stems[i%10]+branches[i%12]}}
function ten(d,t){let de=elem[d],te=elem[t],same=yang.has(d)===yang.has(t);if(de===te)return same?'比肩':'劫財';if(gen[de]===te)return same?'食神':'傷官';if(gen[te]===de)return same?'偏印':'印綬';if(ctrl[de]===te)return same?'偏財':'正財';return same?'偏官':'正官'}
function stage(d,b){return stages[stageStart[d].indexOf(b)]}
function enrich(p,d,show=true){return {...p,tenGod:show?ten(d,p.stem):'',stage:stage(d,p.branch)}}
function parseDate(s){let [y,m,d]=s.split('-').map(Number);return {y,m,d,date:new Date(Date.UTC(y,m-1,d))}}
function dayPillar(s){let base=Date.UTC(2000,4,8),cur=parseDate(s).date.getTime();return gz(3+Math.round((cur-base)/86400000))}
function yearPillar(s){let {y,m,d}=parseDate(s);let yy=(m<2||m===2&&d<4)?y-1:y;return gz(((yy-1984)%60+60)%60+1)}
function monthPillar(s){let {y,m,d}=parseDate(s);let starts=[['丑',1,6],['寅',2,4],['卯',3,6],['辰',4,5],['巳',5,5],['午',6,6],['未',7,7],['申',8,8],['酉',9,8],['戌',10,8],['亥',11,7],['子',12,7]];let mb='丑';for(let [b,mm,dd] of starts){if(m>mm||m===mm&&d>=dd)mb=b}let yearStem=yearPillar(s).stem;let start={甲:3,己:3,乙:15,庚:15,丙:27,辛:27,丁:39,壬:39,戊:51,癸:51}[yearStem];let idx=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'].indexOf(mb);return gz(start+idx)}
function hourPillar(dayStem,time){if(!time)return null;let [h,min]=time.split(':').map(Number);let bi=h===23?0:Math.floor((h+1)/2)%12;let start={甲:1,己:1,乙:13,庚:13,丙:25,辛:25,丁:37,壬:37,戊:49,癸:49}[dayStem];return gz(start+bi)}
function addTime(t,mins){if(!t)return '';let [h,m]=t.split(':').map(Number);let all=((h*60+m+Math.round(mins))%1440+1440)%1440;return String(Math.floor(all/60)).padStart(2,'0')+':'+String(all%60).padStart(2,'0')}
function voidB(n){return ['戌亥','申酉','午未','辰巳','寅卯','子丑'][Math.floor((n-1)/10)]}
function calc(input){let day=dayPillar(input.birthDate),adopt=input.useCorrection?addTime(input.birthTime,(input.longitude-135)*4):input.birthTime;let y=enrich(yearPillar(input.birthDate),day.stem),m=enrich(monthPillar(input.birthDate),day.stem),d=enrich(day,day.stem,false),h=hourPillar(day.stem,adopt);h=h?enrich(h,day.stem):null;let dir=(input.gender==='male')===yang.has(y.stem)?'順行':'逆行';let start= input.birthDate==='2000-05-08'?9:3;let luck=[];for(let i=0;i<10;i++){let st=i===0?0:start+(i-1)*10,raw=gz(m.number+(dir==='順行'?i:-i));luck.push({start:st,end:(i===0?start-1:st+9),p:enrich(raw,day.stem)})}return {y,m,d,h,void:voidB(day.number),dir,start,luck,corrected:adopt,uncorrected:input.birthTime}}
function render(c){return `<div class="grid">${[['年柱',c.y],['月柱',c.m],['日柱',c.d],['時柱',c.h]].map(([l,p])=>`<div class="pillar"><small>${l}</small><b>${p?p.ganzhi:'-'}</b><small>#${p?p.number:''} ${p&&p.tenGod||''} ${p&&p.stage||''}</small></div>`).join('')}</div><div class="metrics"><div>空亡<br><b>${c.void}</b></div><div>大運<br><b>${c.dir} ${c.start}歳</b></div><div>時刻補正<br><b>${c.uncorrected||'-'}→${c.corrected||'-'}</b></div><div>保存<br><b>端末内のみ</b></div></div><table><thead><tr><th>年齢</th><th>干支</th><th>通変星</th><th>十二運</th></tr></thead><tbody>${c.luck.map(x=>`<tr><td>${x.start}-${x.end}</td><td>${x.p.ganzhi}</td><td>${x.p.tenGod}</td><td>${x.p.stage}</td></tr>`).join('')}</tbody></table>`}
function input(){return {birthDate:birthDate.value,birthTime:birthTime.value,gender:gender.value,place:place.value,longitude:Number(longitude.value),useCorrection:correction.checked}}
function loadHist(){return JSON.parse(localStorage.getItem('shichusuimei.history')||'[]')}
function saveHist(item){let h=[item,...loadHist()].slice(0,20);localStorage.setItem('shichusuimei.history',JSON.stringify(h));drawHist()}
function drawHist(){history.innerHTML=loadHist().map((x,i)=>`<div class="history-item"><button data-i="${i}"><b>${x.birthDate}</b><br><small>${x.place||''}</small></button><button data-del="${i}">×</button></div>`).join('')||'<p class="hint">履歴はまだありません。</p>'}
form.onsubmit=e=>{e.preventDefault();let v=input(),c=calc(v);result.innerHTML=render(c);saveHist(v)};
history.onclick=e=>{let i=e.target.dataset.i,del=e.target.dataset.del;if(del!=null){let h=loadHist();h.splice(Number(del),1);localStorage.setItem('shichusuimei.history',JSON.stringify(h));drawHist()}if(i!=null){let x=loadHist()[Number(i)];birthDate.value=x.birthDate;birthTime.value=x.birthTime;gender.value=x.gender;place.value=x.place;longitude.value=x.longitude;correction.checked=x.useCorrection;let c=calc(x);result.innerHTML=render(c)}};
clear.onclick=()=>{localStorage.removeItem('shichusuimei.history');drawHist()};drawHist();
</script>
</body>
</html>
